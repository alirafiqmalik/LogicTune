name: deploy simulator

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "results/latest/**"
      - "src/logictune/**"
      - "scripts/check_results.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-cpu.txt
      - name: Re-verify the recorded results before publishing them
        run: python scripts/check_results.py --engine explicit
      - name: Assemble site (simulator + recorded results)
        run: |
          mkdir -p _site/data
          cp -r simulator/index.html simulator/assets _site/
          cp results/latest/replay.json results/latest/summary.json results/latest/*.csv _site/data/
          echo "$GITHUB_SHA" > _site/data/COMMIT
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
