name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: pip install -r requirements-cpu.txt
      - name: Unit tests (parser, verifier, nuXmv cross-check)
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Simulator tests (timelines, rules, motion, monitor, URL state)
        run: node --test "simulator/tests/*.test.js"
      - name: Verification demo
        run: python main.py demo
      - name: Re-verify committed results
        if: hashFiles('results/latest/index.json') != ''
        run: python scripts/check_results.py --engine explicit
